name: Update PAC File

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Axios
        run: npm install axios

      - name: Run script
        run: node scraper.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Проверяем, существует ли файл вообще
          if [ -f proxy.pac ]; then
            git add proxy.pac
            # Чтобы команда commit не падала с ошибкой, если изменений нет:
            git diff-index --quiet HEAD || git commit -m "Auto-update proxy.pac: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
            echo "Процесс обновления завершен."
          else
            echo "Ошибка: Файл proxy.pac не был создан скриптом!" && exit 1
          fi
