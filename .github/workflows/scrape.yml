name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:      # Позволяет запускать вручную из вкладки Actions

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16.14.2"
          cache: 'npm' # кэширование ускоряет последующие сборки

      - name: Install dependencies
        run: npm ci # Используйте npm install, если у вас нет package-lock.json

      - name: Run install axios
        run: npm install axios

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and push changes
        uses: EndBug/add-and-commit@v9 # Экшен для автоматического коммита
        with:
          message: 'Update scraped data'
          add: 'data.json'
